<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 7: Product Grid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-100 min-h-screen">

  <div class="max-w-6xl mx-auto">
    <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">Featured Products</h2>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      
      <!-- Product 1 -->
      <div class="bg-white p-4 rounded-lg shadow-md space-y-4">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&h=300&fit=crop" alt="Product" class="w-full h-48 object-cover rounded-md">
        <h3 class="font-bold text-lg text-gray-800">Minimalist Watch</h3>
        <p class="text-blue-600 font-semibold">$129.99</p>
      </div>

      <!-- Product 2 -->
      <div class="bg-white p-4 rounded-lg shadow-md space-y-4">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&h=300&fit=crop" alt="Product" class="w-full h-48 object-cover rounded-md">
        <h3 class="font-bold text-lg text-gray-800">Wireless Headphones</h3>
        <p class="text-blue-600 font-semibold">$199.99</p>
      </div>

      <!-- Product 3 -->
      <div class="bg-white p-4 rounded-lg shadow-md space-y-4">
        <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500&h=300&fit=crop" alt="Product" class="w-full h-48 object-cover rounded-md">
        <h3 class="font-bold text-lg text-gray-800">Vintage Camera</h3>
        <p class="text-blue-600 font-semibold">$299.99</p>
      </div>

      <!-- Product 4 -->
      <div class="bg-white p-4 rounded-lg shadow-md space-y-4">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&h=300&fit=crop" alt="Product" class="w-full h-48 object-cover rounded-md">
        <h3 class="font-bold text-lg text-gray-800">Running Shoes</h3>
        <p class="text-blue-600 font-semibold">$89.99</p>
      </div>

      <!-- Product 5 -->
      <div class="bg-white p-4 rounded-lg shadow-md space-y-4">
        <img src="https://images.unsplash.com/photo-1583394838336-acd977736f90?w=500&h=300&fit=crop" alt="Product" class="w-full h-48 object-cover rounded-md">
        <h3 class="font-bold text-lg text-gray-800">Gaming Controller</h3>
        <p class="text-blue-600 font-semibold">$59.99</p>
      </div>

      <!-- Product 6 -->
      <div class="bg-white p-4 rounded-lg shadow-md space-y-4">
        <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=500&h=300&fit=crop" alt="Product" class="w-full h-48 object-cover rounded-md">
        <h3 class="font-bold text-lg text-gray-800">Classic Sneakers</h3>
        <p class="text-blue-600 font-semibold">$79.99</p>
      </div>

    </div>
  </div>

</body>
</html>
