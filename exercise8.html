<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 8: Hero Section with Overlay</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- Hero Container -->
  <div class="relative w-full max-w-5xl h-[500px] rounded-2xl overflow-hidden shadow-lg flex items-center justify-center text-center">
    
    <!-- Background Image -->
    <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200&h=800&fit=crop" alt="Hero Background" class="absolute inset-0 w-full h-full object-cover">

    <!-- Dark Semi-Transparent Overlay -->
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- Centered Content -->
    <div class="relative z-10 text-white space-y-6 px-4 max-w-2xl">
      <h1 class="text-4xl md:text-5xl font-bold tracking-tight">Welcome to Our Platform</h1>
      <p class="text-lg md:text-xl text-gray-200 leading-relaxed">Discover amazing experiences and build stunning web interfaces effortlessly with Tailwind CSS.</p>
      <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition-colors duration-300 shadow-md">
        Get Started
      </button>
    </div>

  </div>

</body>
</html>
