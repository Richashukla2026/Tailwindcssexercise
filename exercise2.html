<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2: Colorful Alert Boxes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 space-y-4 max-w-xl">
  
  <!-- Success Alert -->
  <div class="p-4 rounded-lg bg-green-100 border border-green-400 text-green-700">
    <span class="font-bold">Success:</span> Your changes have been successfully saved.
  </div>

  <!-- Warning Alert -->
  <div class="p-4 rounded-lg bg-yellow-100 border border-yellow-400 text-yellow-700">
    <span class="font-bold">Warning:</span> Your session is about to expire shortly.
  </div>

  <!-- Danger Alert -->
  <div class="p-4 rounded-lg bg-red-100 border border-red-400 text-red-700">
    <span class="font-bold">Danger:</span> Failed to connect to the server. Please try again.
  </div>

</body>
</html>
